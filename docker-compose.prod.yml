version: '3.8'

# ─────────────────────────────────────────────────────────────
# Production compose
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Required env vars (set in .env or Docker secrets):
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#   REDIS_PASSWORD
#   SECRET_KEY
#   GROQ_API_KEY
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, S3_BUCKET_NAME
#   SMTP_USER, SMTP_PASSWORD
# ─────────────────────────────────────────────────────────────

x-common-env: &common-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sme_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sme_kb}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
  ENVIRONMENT: production
  DEBUG: "false"

x-app-build: &app-build
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime
  env_file: .env
  environment:
    <<: *common-env
  networks:
    - sme_network
  restart: always
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  # ── Infrastructure ──────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    container_name: sme_postgres_prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sme_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sme_kb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sme_user} -d ${POSTGRES_DB:-sme_kb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - sme_network
    restart: always

  redis:
    image: redis:7-alpine
    container_name: sme_redis_prod
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --save 60 100
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sme_network
    restart: always

  # ── Application services ────────────────────────────────────

  migrate:
    <<: *app-build
    container_name: sme_migrate_prod
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  backend:
    <<: *app-build
    container_name: sme_backend_prod
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 4
      --worker-class uvicorn.workers.UvicornWorker
      --log-level warning
      --access-log
    expose:
      - "8000"
    volumes:
      - uploads:/app/uploads
      - models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Celery workers ──────────────────────────────────────────

  celery_worker:
    <<: *app-build
    container_name: sme_celery_worker_prod
    command: >
      celery -A app.core.celery_app worker
      --loglevel=warning
      --concurrency=4
      --queues=default,documents,training
      --hostname=worker@%h
      --max-tasks-per-child=200
    volumes:
      - uploads:/app/uploads
      - models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    <<: *app-build
    container_name: sme_celery_beat_prod
    command: >
      celery -A app.core.celery_app beat
      --loglevel=warning
      --schedule=/tmp/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  flower:
    <<: *app-build
    container_name: sme_flower_prod
    command: >
      celery -A app.core.celery_app flower
      --port=5555
      --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-changeme}
      --url_prefix=flower
    expose:
      - "5555"
    depends_on:
      redis:
        condition: service_healthy

  # ── Model trainer (run on demand) ──────────────────────────
  # docker compose -f docker-compose.prod.yml run --rm model_trainer
  model_trainer:
    <<: *app-build
    container_name: sme_model_trainer_prod
    command: python train_model.py --mode full --save-dir /app/models
    volumes:
      - models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - training
    restart: no

  # ── Nginx reverse proxy ─────────────────────────────────────

  nginx:
    image: nginx:1.25-alpine
    container_name: sme_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sme_network
    restart: always
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  uploads:
  models:
  nginx_logs:

networks:
  sme_network:
    driver: bridge

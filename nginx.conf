worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    server_tokens off;                # hide nginx version

    # Upload size limit (matches MAX_UPLOAD_SIZE_MB in config)
    client_max_body_size 55M;

    # Gzip compression
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1024;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m    rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m   rate=5r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=2r/s;

    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    upstream flower {
        server flower:5555;
    }

    # ── HTTP → HTTPS redirect ───────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS main server ───────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL — replace with real cert paths or use certbot
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Health check (no auth, no rate limit) ────────────
        location = /health {
            proxy_pass         http://backend/health;
            proxy_set_header   Host $host;
            access_log         off;
        }

        # ── Auth endpoints (stricter rate limit) ─────────────
        location /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            limit_req_status 429;
            include /etc/nginx/proxy_params.conf;
            proxy_pass http://backend;
        }

        # ── Document upload (slow lane) ──────────────────────
        location /api/v1/documents/upload {
            limit_req zone=upload burst=5 nodelay;
            proxy_read_timeout 120s;
            client_max_body_size 55M;
            include /etc/nginx/proxy_params.conf;
            proxy_pass http://backend;
        }

        # ── Streaming SSE (advisor/stream) ───────────────────
        location /api/v1/advisor/stream {
            proxy_pass          http://backend;
            proxy_set_header    Host $host;
            proxy_set_header    X-Real-IP $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_read_timeout  600s;        # keep SSE alive
            proxy_buffering     off;         # required for SSE
            proxy_cache         off;
            chunked_transfer_encoding on;
        }

        # ── Flower (task monitor — internal only) ────────────
        location /flower/ {
            proxy_pass         http://flower/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            # Add IP allowlist in production:
            # allow 10.0.0.0/8;
            # deny all;
        }

        # ── All other API traffic ─────────────────────────────
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            include /etc/nginx/proxy_params.conf;
            proxy_pass http://backend;
        }

        # ── Swagger docs ──────────────────────────────────────
        location /api/v1/docs {
            include /etc/nginx/proxy_params.conf;
            proxy_pass http://backend;
        }
        location /api/v1/redoc {
            include /etc/nginx/proxy_params.conf;
            proxy_pass http://backend;
        }
        location /api/v1/openapi.json {
            include /etc/nginx/proxy_params.conf;
            proxy_pass http://backend;
        }
    }
}
